[workspace]
resolver = "2"
members = [
    "crates/clix-core",
    "crates/clix-gh-stars",
    "crates/clix-lark-base",
    "crates/clix-media",
    "crates/clix-read",
    "crates/clix-rss-api",
    "crates/clix-rss-delivery",
    "crates/clix-rss-list",
    "crates/clix-rss-store",
    "crates/clix-rss-sync",
    "crates/clix-x-api",
    "crates/clix-x-bookmarks",
    "crates/clix-x-read",
    "crates/clix-wx-read",
    ".",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[workspace.dependencies]
anstyle = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "5"
clap = { version = "4.5", features = ["derive"] }
feed-rs = { version = "2.4", features = ["sanitize"] }
fs2 = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
redb = "2"
toml = "0.8"
tokio = "1.40"
wiremock = "0.6.5"
html2md = "0.2"
scraper = "0.22"
regex = "1.11"

[package]
name = "clix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast, local-first toolkit for feeds, developer platforms, and content."
license.workspace = true
readme = "README.md"
keywords = ["cli", "developer-tools", "feeds", "automation", "local-first"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clix-core = { path = "crates/clix-core" }
clix-gh-stars = { path = "crates/clix-gh-stars" }
clix-read = { path = "crates/clix-read" }
clix-rss-list = { path = "crates/clix-rss-list" }
clix-rss-sync = { path = "crates/clix-rss-sync" }
clix-x-bookmarks = { path = "crates/clix-x-bookmarks" }
clix-x-read = { path = "crates/clix-x-read" }
clix-wx-read = { path = "crates/clix-wx-read" }
tokio = { workspace = true, features = ["rt"] }
